name: Probe sources

# Saves raw pages from each source and shows what the parsers make of them, to
# check a parser against the live site or diagnose a source that stopped working.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to probe, comma-separated (blank = all)"
        default: ""
      pmn_bodies:
        description: "Public Notice body ids to check instead of the defaults (comma-separated)"
        default: ""
      pmn_notices:
        description: "Public Notice notice ids whose body ids to look up (comma-separated)"
        default: ""
      urls:
        description: "Other pages to save, space-separated (to scout a new source; skips the sources)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe other pages
        if: inputs.urls != ''
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python - <<'PY'
          import os, pathlib
          from civic_scout.http import Http
          from civic_scout.sources.text_utils import pdf_text
          out = pathlib.Path("probe/urls")
          out.mkdir(parents=True, exist_ok=True)
          http = Http(60)
          for n, url in enumerate(os.environ["URLS"].split(), 1):
              try:
                  r = http.session.get(url, timeout=60)
                  kind = r.headers.get("content-type", "")
                  print(f"{n}: {url} -> {r.status_code} {kind} {len(r.content)} bytes, final {r.url}")
                  if "pdf" in kind:
                      data, ext = pdf_text(r.content).encode(), "txt"
                  else:
                      data, ext = r.content, "json" if "json" in kind else "html" if "html" in kind else "txt"
                  (out / f"{n:02d}.{ext}").write_bytes(data)
              except Exception as exc:
                  print(f"{n}: {url} FAILED {type(exc).__name__}: {exc}")
          PY
      - name: Probe
        if: inputs.urls == ''
        env:
          PMN_BODIES: ${{ inputs.pmn_bodies || vars.PMN_BODIES }}
          PMN_NOTICES: ${{ inputs.pmn_notices }}
          SOURCES: ${{ inputs.sources }}
        run: python -m civic_scout probe --out probe
      - name: Show samples in the log
        run: |
          for f in $(find probe -type f | sort); do
            echo "===== $f ($(wc -c < "$f") bytes)"
            case "$f" in
              *.html|*.txt|*.json|*.jsonl|*.csv) python - "$f" <<'PY'
          import sys, re
          from bs4 import BeautifulSoup
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          if sys.argv[1].endswith(".html"):
              soup = BeautifulSoup(raw, "lxml")
              other = "/urls/" in sys.argv[1]
              print("TITLE:", soup.title.get_text(strip=True) if soup.title else None)
              for a in soup.find_all("a", href=True)[:None if other else 80]:
                  print("LINK:", a["href"], "|", a.get_text(" ", strip=True)[:80])
              body = soup.body or soup
              for t in body(["script", "style"]):
                  t.decompose()
              print(re.sub(r"\n\s*\n+", "\n", body.get_text("\n"))[:20000 if other else 4000])
          else:
              print(raw[:400000] if "/urls/" in sys.argv[1] else raw[:3000])
          PY
              ;;
              *) echo "(binary)";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
